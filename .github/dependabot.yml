version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # @typescript-eslint does not yet support TS 6.x - revisit when eslint v9 supports it
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
    groups:
      npm-patch:
        update-types: [patch]
      npm-updates:
        update-types: [minor, major]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - "ci"
    commit-message:
      prefix: chore
    groups:
      github-actions-patch:
        update-types: [patch]
      github-actions-updates:
        update-types: [minor, major]
